name: structurezyme
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - pytorch
  - bioconda
dependencies:
  - python=3.11
  - pyarrow
  - pdbfixer
  - foldseek
  - mmseqs2
  - biotite
  - openbabel
  - openmm==8.3.1
  - fpocket
  - pip
  - plip
  - pip:
    # NOTE: after creating this env, install the package itself with: pip install -e .
    - enzymetk
    # - filterzyme  # removed: self-referential; install via `pip install -e .` instead
    - rdkit
    - freesasa
    - docko
    - chai_lab
    - squidly  # catalytic-residue prediction CLI; requires GPU for ESM2 inference
    - pydantic
    - pyyaml
    - filelock
