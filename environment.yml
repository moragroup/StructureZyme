name: structurezyme
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - pytorch
  - bioconda
dependencies:
  - python=3.11
  - pyarrow
  - pdbfixer
  - foldseek
  - mmseqs2
  - biotite
  - openbabel
  - openmm==8.3.1
  - fpocket
  - pip
  - plip
  - pip:
    # NOTE: after creating this env, install the package itself with: pip install -e .
    - enzymetk==0.1.0
    - rdkit
    - freesasa
    - docko
    - chai_lab
    - cuequivariance_torch==0.10.0
    # Pinned to the fork branch that fixes the upstream CLI dropping
    # --mean_prob/--mean_var before invoking the inner ensemble worker
    # (upstream https://github.com/WRiegs/Squidly is unpatched as of 2026-08).
    # This pin is what makes the local threshold-recompute workaround in
    # structurezyme/steps/squidly_step.py unnecessary. Pinned to the immutable
    # commit (not the branch) for reproducible rebuilds; the commit is on branch
    # fix/forward-mean-prob-mean-var-cli. Repoint at an upstream release once the
    # fix is merged into WRiegs/Squidly.
    - squidly @ git+https://github.com/HerrLuca99/Squidly.git@022fa40  # catalytic-residue prediction CLI; requires GPU for ESM2 inference
    # TODO(Task 8): repoint to git+https://github.com/moragroup/Squidly.git@022fa40 once the org fork exists (one-line change, no env rebuild needed).
    - pydantic
    - pyyaml
    - filelock
