# All-modules StructureZyme run config for the Phase F GPU verification run.
#
# output_root / boltz_cache_dir / squidly_weights_dir / placer_env_path are left
# empty here and filled from the `default` host profile (structurezyme/hosts.yml)
# at run time via `run --host default`. input_csv points at the CalB input
# pickle produced by tools/gpu_run/make_input.py.
#
# Every module is ENABLED, including the three that default to disabled
# (vina, fastrelax, placer), so this run exercises the full pipeline.
paths:
  output_root: ''
  boltz_cache_dir: ''
  squidly_weights_dir: null
  # placer_env_path omitted -> defaults to the sentinel, which the `default`
  # host profile fills. Set it explicitly only to override the host value.
  input_csv: tools/gpu_run/input.pkl
runtime:
  user: lherrmann
  run_id: gpu-allmodules-01
  # NOTE: keep at 1. The external enzymetk Boltz/docking steps np.array_split the
  # input frame across threads and then assign per-pose outputs back column-wise;
  # with a single input row and num_threads > 1 this raises
  # "Length of values (N) does not match length of index (1)". One thread is also
  # fine perf-wise for a single enzyme. Increase only for many-row inputs.
  num_threads: 1
  # Re-run the affected tail explicitly. fastrelax now also publishes its
  # *_relaxed.pdb into preparedfiles_for_superimposition/ (so the 5 analysis
  # steps find the relaxed poses instead of silently skipping); protein_rmsd's
  # earlier checkpoint has a corrupt `tool` column (pre _relaxed tool-name fix).
  # The analysis steps are listed explicitly because fastrelax re-pickling may
  # produce byte-identical output (unchanged input hash), which would otherwise
  # let them skip and miss the newly-copied relaxed files. Remove after a clean
  # full run.
  force: [fastrelax, protein_rmsd, ligand_rmsd, geometric_filter, fpocket, ligand_sasa, plip, placer]
steps:
  squidly:
    enabled: true
  chai:
    enabled: true
  boltz:
    enabled: true
  vina:
    enabled: true
  docking_metrics:
    enabled: true
  prepare_files:
    enabled: true
  fastrelax:
    enabled: true
    fastrelax_top_k: 2
    fastrelax_mode: ligand_focused
  superimpose:
    enabled: true
  protein_rmsd:
    enabled: true
  ligand_rmsd:
    enabled: true
  geometric_filter:
    enabled: true
  fpocket:
    enabled: true
  ligand_sasa:
    enabled: true
  plip:
    enabled: true
  placer:
    enabled: true
    placer_predict_ligand: LIG
    placer_nsamples: 50
    placer_rerank: prmsd
