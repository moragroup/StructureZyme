# Multi-row all-modules StructureZyme run config (3 enzymes).
#
# Validates N>1 handling: per-row iteration, N-vs-N RMSD matrices, tool
# detection, the per-row cofactor conditional in geometric_filter (CalB has no
# cofactor, both FMOs use FAD), and the fail-loud missing-PDB guards.
#
# output_root / boltz_cache_dir / squidly_weights_dir / placer_env_path are
# left empty and filled from the `default` host profile at run time via
# `run --host default`. input_csv points at the 3-row pickle produced by
# tools/gpu_run/make_input_multirow.py.
paths:
  output_root: ''
  boltz_cache_dir: ''
  squidly_weights_dir: null
  input_csv: tools/gpu_run/input_multirow.pkl
runtime:
  user: lherrmann
  run_id: gpu-multirow-02
  # KEEP at 1. The external enzymetk Boltz/Chai steps np.array_split the input
  # frame across threads and assign per-pose outputs back by position; with
  # num_threads > 1 this either crashes (rows < threads) or stores list-wrapped
  # cell values (rows == threads). One thread is correct for any row count.
  num_threads: 1
  force: []
steps:
  squidly:
    enabled: true
    # squidly runs at its calibrated defaults (mean_prob 0.6 / mean_var 0.225).
    # vina_residues is empty in the input, so entries WITH predicted catalytic
    # residues follow the full auto squidly->vina path. Entries WITHOUT (e.g.
    # the two flavin monooxygenases F5SYD3 / A0A410H4M7, which lack a canonical
    # catalytic triad) are no longer dropped: they keep their row, skip vina
    # per-row, and are co-folded by chai/boltz + analysed downstream. This
    # exercises the per-row-vina fallback with all 3 enzymes surviving.
    # (squidly_mean_prob / squidly_mean_var can override the thresholds if a
    # more permissive residue prediction is ever wanted.)
  chai:
    enabled: true
  boltz:
    enabled: true
  vina:
    enabled: true
  docking_metrics:
    enabled: true
  prepare_files:
    enabled: true
  fastrelax:
    enabled: true
    fastrelax_top_k: 2
    fastrelax_mode: ligand_focused
  superimpose:
    enabled: true
  protein_rmsd:
    enabled: true
  ligand_rmsd:
    enabled: true
  geometric_filter:
    enabled: true
  fpocket:
    enabled: true
  ligand_sasa:
    enabled: true
  plip:
    enabled: true
  placer:
    enabled: true
    placer_predict_ligand: LIG
    placer_nsamples: 50
    placer_rerank: prmsd
